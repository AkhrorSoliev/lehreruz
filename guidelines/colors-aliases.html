<!-- @dsCard group="Colors" viewport="700x220" name="Semantic aliases" subtitle="Use these in components, not raw scales" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--paper-0)}.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 16px}.g div{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:12px;color:var(--text-body)}.g i{width:32px;height:32px;border-radius:8px;flex:none;box-shadow:inset 0 0 0 1px rgba(20,22,27,.1)}</style></head><body><div class="g"><div><i style="background:var(--bg-page)"></i><span>--bg-page</span></div><div><i style="background:var(--surface-card)"></i><span>--surface-card</span></div><div><i style="background:var(--surface-inverse)"></i><span>--surface-inverse</span></div><div><i style="background:var(--surface-highlight)"></i><span>--surface-highlight</span></div><div><i style="background:var(--action-primary)"></i><span>--action-primary</span></div><div><i style="background:var(--action-accent)"></i><span>--action-accent</span></div><div><i style="background:var(--text-strong)"></i><span>--text-strong</span></div><div><i style="background:var(--text-muted)"></i><span>--text-muted</span></div><div><i style="background:var(--border-hairline)"></i><span>--border-hairline</span></div><div><i style="background:var(--status-success)"></i><span>--status-success</span></div><div><i style="background:var(--status-danger)"></i><span>--status-danger</span></div><div><i style="background:var(--surface-player)"></i><span>--surface-player</span></div></div></body></html>
