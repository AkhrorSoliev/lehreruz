<!-- @dsCard group="Colors" viewport="700x150" name="Paper — surfaces" subtitle="Warm off-white page, cards, hairlines" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--paper-0)}.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px}.s{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--text-muted)}.s b{color:var(--text-strong);font-weight:600;font-size:13px;margin-top:6px}.c{height:56px;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(20,22,27,.08)}.s span{font-family:var(--font-mono);font-size:11px}</style></head><body><div class="row"><div class="s"><div class="c" style="background:var(--paper-0)"></div><b>0 card</b><span>--paper-0</span><span>#FFFFFF</span></div><div class="s"><div class="c" style="background:var(--paper-50)"></div><b>50 page</b><span>--paper-50</span><span>#FAF8F3</span></div><div class="s"><div class="c" style="background:var(--paper-100)"></div><b>100 sunken</b><span>--paper-100</span><span>#F3F1EA</span></div><div class="s"><div class="c" style="background:var(--paper-200)"></div><b>200 hairline</b><span>--paper-200</span><span>#E8E5DD</span></div><div class="s"><div class="c" style="background:var(--paper-300)"></div><b>300 border</b><span>--paper-300</span><span>#D9D5CA</span></div></div></body></html>
