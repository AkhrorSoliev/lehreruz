<!-- @dsCard group="Colors" viewport="700x170" name="Semantic status" subtitle="Rot = sale/danger · Grün = done · Blau = info" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{padding:20px;background:var(--paper-0)}.row{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:12px}.s{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--text-muted)}.s b{color:var(--text-strong);font-weight:600;font-size:13px;margin-top:6px}.c{height:56px;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(20,22,27,.08)}.s span{font-family:var(--font-mono);font-size:11px}</style></head><body><div class="row"><div class="s"><div class="c" style="background:var(--red-500)"></div><b>Rot 500</b><span>--red-500</span><span>#E5383B</span></div><div class="s"><div class="c" style="background:var(--red-100)"></div><b>Rot 100</b><span>--red-100</span><span>#FDE2E2</span></div><div class="s"><div class="c" style="background:var(--green-500)"></div><b>Grün 500</b><span>--green-500</span><span>#1F9D55</span></div><div class="s"><div class="c" style="background:var(--green-100)"></div><b>Grün 100</b><span>--green-100</span><span>#D9F1E2</span></div><div class="s"><div class="c" style="background:var(--blue-500)"></div><b>Blau 500</b><span>--blue-500</span><span>#2F5BEA</span></div><div class="s"><div class="c" style="background:var(--blue-100)"></div><b>Blau 100</b><span>--blue-100</span><span>#DCE6FD</span></div></div></body></html>
